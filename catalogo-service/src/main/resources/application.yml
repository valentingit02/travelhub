server:
  port: ${PORT:8081}

spring:
  application:
    name: catalogo-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogo_db}
    username: ${DB_USER:travelhub}
    password: ${DB_PASSWORD:travelhub}
  jpa:
    hibernate:
      ddl-auto: none          # el esquema lo maneja Flyway (src/main/resources/db/migration)
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    template:
      observation-enabled: true      # propaga la traza por RabbitMQ
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false   # tras los reintentos, el mensaje va a la DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 15m      # las tarifas no se cachean mas de unos minutos

travelhub:
  ofertas:
    vigencia: 60m            # tiempo para reservar una oferta sin volver a buscar
  tipo-cambio:
    url: ${TIPO_CAMBIO_URL:https://api.frankfurter.dev/v1}
    vigencia: 6h
    respaldo:                # USD por unidad; solo si la API no responde (actualizar antes de la demo)
      EUR: 1.10
      GBP: 1.30
      BRL: 0.18
  proveedores:
    modo: ${PROVEEDORES_MODO:mock}   # mock | real
    duffel:
      url: https://api.duffel.com
      token: ${DUFFEL_TOKEN:}
      version: ${DUFFEL_VERSION:v2}
    hotelbeds:
      url: https://api.test.hotelbeds.com
      hotel-key: ${HOTELBEDS_HOTEL_API_KEY:}
      hotel-secret: ${HOTELBEDS_HOTEL_SECRET:}
      activities-key: ${HOTELBEDS_ACTIVITIES_API_KEY:}
      activities-secret: ${HOTELBEDS_ACTIVITIES_SECRET:}
      destinos:            # IATA -> codigo de destino de Hotelbeds (verificar en su Content API)
        BRC: BRC
        MDZ: MDZ
        IGR: IGU
        USH: USH
        MAD: MAD

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      duffel:
        base-config: default
      hotelbeds:
        base-config: default
      tipoCambio:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  health:
    redis:
      enabled: false   # Redis es opcional: si se cae, el servicio sigue sano
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{correlationId:-sin-id}] %logger{36} - %msg%n"
