server:
  port: ${PORT:8083}

spring:
  application:
    name: reservas-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservas_db}
    username: ${DB_USER:travelhub}
    password: ${DB_PASSWORD:travelhub}
  jpa:
    hibernate:
      ddl-auto: none          # el esquema lo maneja Flyway
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

travelhub:
  servicios:
    catalogo: ${CATALOGO_URL:http://localhost:8081}
    precios: ${PRECIOS_URL:http://localhost:8082}
  outbox:
    intervalo-ms: 1000
  reservas:
    vencimiento: ${RESERVAS_VENCIMIENTO:15m}                          # individual sin pago -> FALLIDA
    vencimiento-compartida: ${RESERVAS_VENCIMIENTO_COMPARTIDA:24h}    # compartida sin que paguen todos -> FALLIDA
    revision-ms: 30000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
    instances:
      catalogo:
        base-config: default
      precios:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{correlationId:-sin-id}] %logger{36} - %msg%n"
