server:
  port: ${PORT:8085}

spring:
  application:
    name: notificaciones-service
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
  # Por defecto: Mailpit (bandeja local). Para casillas reales, ver .env.example (Gmail u otro SMTP).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

travelhub:
  mail:
    remitente: ${MAIL_REMITENTE:reservas@travelhub.local}
  web:
    url: ${WEB_URL:http://localhost:8080}
  servicios:
    ia: ${IA_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{correlationId:-sin-id}] %logger{36} - %msg%n"
