# API Gateway + frontend: un unico punto de entrada en http://localhost:8080
#
# resolver + variables: nginx vuelve a resolver el nombre del contenedor cada 10 s.
# Sin esto, si Docker recrea un servicio (nueva IP) el gateway sigue apuntando a la vieja
# y devuelve 502 hasta reiniciarlo.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_correlation_id $cid {
    ""      $request_id;
    default $http_x_correlation_id;
}

server {
    listen 80;
    client_max_body_size 2m;

    proxy_set_header X-Correlation-Id $cid;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    add_header X-Correlation-Id $cid always;

    set $catalogo       http://catalogo:8081;
    set $precios        http://precios:8082;
    set $reservas       http://reservas:8083;
    set $pagos          http://pagos:8084;
    set $notificaciones http://notificaciones:8085;
    set $ia             http://ia:8000;

    location /api/catalogo/       { proxy_pass $catalogo; }
    location /api/precios/        { proxy_pass $precios; }
    location /ws                  { proxy_pass $precios; }
    location /api/viajeros        { proxy_pass $reservas; }
    location /api/reservas        { proxy_pass $reservas; }
    location /api/seguimientos    { proxy_pass $reservas; }
    location /api/pagos           { proxy_pass $pagos; }
    location /api/notificaciones  { proxy_pass $notificaciones; }
    location /api/ia/             { proxy_pass $ia; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
