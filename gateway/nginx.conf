# API Gateway + frontend: un unico punto de entrada en http://localhost:8080
map $http_x_correlation_id $cid {
    ""      $request_id;
    default $http_x_correlation_id;
}

server {
    listen 80;
    client_max_body_size 2m;

    proxy_set_header X-Correlation-Id $cid;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header X-Correlation-Id $cid always;

    location /api/catalogo/   { proxy_pass http://catalogo:8081; }
    location /api/precios/    { proxy_pass http://precios:8082; }
    location /ws              { proxy_pass http://precios:8082; }
    location /api/viajeros    { proxy_pass http://reservas:8083; }
    location /api/reservas    { proxy_pass http://reservas:8083; }
    location /api/seguimientos { proxy_pass http://reservas:8083; }
    location /api/pagos       { proxy_pass http://pagos:8084; }
    location /api/ia/         { proxy_pass http://ia:8000; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
