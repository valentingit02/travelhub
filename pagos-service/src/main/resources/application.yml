server:
  port: ${PORT:8084}

spring:
  application:
    name: pagos-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pagos_db}
    username: ${DB_USER:travelhub}
    password: ${DB_PASSWORD:travelhub}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

travelhub:
  pagos:
    limite: 10000      # montos mayores se rechazan (para probar la compensacion)
    demora-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sin-id}] %logger{36} - %msg%n"
