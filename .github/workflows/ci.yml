# Corre en cada PR hacia main y en cada push a main.
# Los 3 jobs se marcan como obligatorios en la proteccion de la rama.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: java-build-y-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar, testear y medir cobertura (incluye Testcontainers)
        run: mvn -B -ntp clean verify
      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de tests (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "| Modulo | Lineas cubiertas |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in */target/site/jacoco/jacoco.csv; do
            [ -f "$f" ] || continue
            m=$(dirname $(dirname $(dirname $(dirname $f))))
            awk -F, -v m="$m" 'NR>1 {c+=$9; t+=$8+$9} END {if (t>0) printf "| %s | %.1f %% |\n", m, 100*c/t}' "$f" >> $GITHUB_STEP_SUMMARY
          done
      - name: Reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: '**/target/site/jacoco/'
          retention-days: 14
      - name: Reportes de tests si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: '**/target/surefire-reports/'
          retention-days: 7

  ia:
    name: ia-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ia-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ia-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests y validacion del modelo
        env:
          RABBIT_HABILITADO: 'false'
        run: |
          python -m pytest -q
          python evaluar_modelo.py | tee -a $GITHUB_STEP_SUMMARY

  frontend:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
